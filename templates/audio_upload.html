<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Link Audio | Traditional Knowledge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5 bg-white p-4 shadow rounded">
    <h3 class="mb-4 text-center">Link Audio to Verse</h3>
    <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
            <label>Verse:</label>
            <select name="verse_id" class="form-control">
                {% for verse in verses %}
                <option value="{{ verse.id }}">{{ verse.title }} (ID {{ verse.id }})</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label>Start Time (e.g., 00:00)</label>
            <input type="text" name="start_time" class="form-control">
        </div>
        <div class="mb-3">
            <label>End Time (e.g., 00:10)</label>
            <input type="text" name="end_time" class="form-control">
        </div>
        <div class="mb-3">
            <label>Upload Audio File (MP3/WAV)</label>
            <input type="file" name="audio" accept="audio/*" class="form-control">
        </div>
        <div class="mb-3">
            <label>Audio Description / Translation</label>
            <textarea name="audio_description" rows="3" class="form-control" placeholder="e.g., Translation or explanation of the verse..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary w-100">Link Audio</button>
    </form>
    <div class="mt-3 text-center">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back to Home</a>
    </div>
</div>
</body>
</html>
