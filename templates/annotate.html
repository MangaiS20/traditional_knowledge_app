<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Annotate Verse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #e8f5e9;
      font-family: 'Segoe UI', sans-serif;
    }
    .container {
      max-width: 900px;
      margin-top: 40px;
    }
    .card {
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
  </style>
  <script>
    function updateLines() {
      const select = document.getElementById("text_id");
      const script = document.getElementById("script").value;
      const verseData = JSON.parse(document.getElementById("verse_data").textContent);
      const outputDiv = document.getElementById("annotation_lines");

      outputDiv.innerHTML = "";
      const selectedId = parseInt(select.value);
      if (!selectedId || !script) return;

      const verse = verseData.find(v => v.id === selectedId);
      const text = script === "Devanagari" ? verse.devanagari_text : verse.roman_text;
      if (!text) return;

      const lines = text.split("।");
      lines.forEach((line, index) => {
        line = line.trim();
        if (line) {
          outputDiv.innerHTML += `
            <div class="mb-3">
              <label><strong>${line}।</strong></label>
              <input type="hidden" name="line_${index}" value="${line}">
              <input type="text" name="note_${index}" class="form-control mt-1" placeholder="Add your note here">
            </div>
          `;
        }
      });
    }
  </script>
</head>
<body>
<div class="container">
  <div class="card">
    <h4 class="text-center mb-4">Annotate Sanskrit Verse</h4>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <div class="mb-3">
        <label for="text_id">Select Verse</label>
        <select class="form-select" name="text_id" id="text_id" onchange="updateLines()" required>
          <option value="">-- Select Verse --</option>
          {% for verse in verses %}
            <option value="{{ verse.id }}">{{ verse.title }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="mb-3">
        <label for="script">Select Script</label>
        <select class="form-select" name="script" id="script" onchange="updateLines()" required>
          <option value="">-- Choose Script --</option>
          <option value="Devanagari">Devanagari</option>
          <option value="Roman">Roman</option>
        </select>
      </div>

      <div id="annotation_lines"></div>

      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success">Submit Annotation</button>
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Back to Home</a>
      </div>
    </form>
  </div>

  <!-- Embed JSON verse data for JS -->
  <script type="application/json" id="verse_data">{{ verses|tojson }}</script>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
