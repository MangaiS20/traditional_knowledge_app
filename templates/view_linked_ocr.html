<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OCR Text Preview</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h4>OCR Linked Text for: {{ result.filename }}</h4>
  <div class="card mt-3">
    <div class="card-body">
      <pre style="white-space: pre-wrap;">{{ result.text }}</pre>
    </div>
  </div>

  <div class="mt-3">
    <a href="{{ url_for('ocr_link') }}" class="btn btn-outline-secondary">← Back to Link OCR</a>
  </div>
</div>
</body>
</html>
