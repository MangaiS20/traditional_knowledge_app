<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OCR Annotation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: #e7f0fd;
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 800px;
      margin-top: 50px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .btn-home {
      margin-top: 20px;
    }
  </style>
</head>
<body>
<div class="container">
  <h3>Annotate Manuscript with OCR</h3>
  <form method="POST">
    <div class="mb-3">
      <label>Manuscript ID</label>
      <input type="text" name="manuscript_id" class="form-control" required>
    </div>
    <div class="mb-3">
      <label>OCR Text</label>
      <textarea name="ocr_text" class="form-control" rows="4" required></textarea>
    </div>
    <div class="mb-3">
      <label>Comment</label>
      <input type="text" name="comment" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Submit Annotation</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary btn-home">Back to Home</a>
  </form>
</div>
</body>
</html>
