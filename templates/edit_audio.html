<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Audio Info</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3>Edit Audio for: {{ audio.verse_id }}</h3>
    <form method="POST">
        <div class="mb-3">
            <label>Start Time</label>
            <input type="text" name="start_time" value="{{ audio.start_time }}" class="form-control">
        </div>
        <div class="mb-3">
            <label>End Time</label>
            <input type="text" name="end_time" value="{{ audio.end_time }}" class="form-control">
        </div>
        <div class="mb-3">
            <label>Description</label>
            <input type="text" name="audio_description" value="{{ audio.audio_description }}" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Update</button>
        <a href="{{ url_for('view_audio') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>
